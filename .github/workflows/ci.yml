name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck · Lint · Unit · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test # unit + security (integration auto-skips with no server)
      - run: npm run build
      - name: Generate SBOM (CycloneDX)
        run: npx --yes @cyclonedx/cyclonedx-npm --output-file sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  e2e:
    name: Integration · E2E · DAST
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: keyshield
          POSTGRES_PASSWORD: keyshield
          POSTGRES_DB: keyshield
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U keyshield" --health-interval 5s
          --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://keyshield:keyshield@localhost:5432/keyshield
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-session-secret-at-least-32-bytes-long-000
      APP_ORIGIN: http://localhost:3000
      BREACH_MODE: offline
      ADMIN_EMAIL: admin@keyshield.local
      ADMIN_PASSWORD: correct-horse-battery-staple-42
      ADMIN_TOTP_SECRET: KS5DEMOADMINSEEDTOTPBASE32SECRET
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Migrate + seed
        run: npm run db:migrate && npm run db:seed
      - run: npm run build
      - name: Start app
        run: |
          npm start &
          npx --yes wait-on http://localhost:3000/api/health --timeout 60000
      - name: Integration tests
        run: npx vitest run tests/integration
        env:
          KEYSHIELD_BASE_URL: http://localhost:3000
      - name: Playwright e2e
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: tests/e2e/screenshots
      - name: OWASP ZAP baseline (DAST)
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: http://localhost:3000
          fail_action: false

  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3

  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep ci
        env:
          SEMGREP_RULES: "p/default p/typescript p/owasp-top-ten p/nodejs p/secrets"

  trivy:
    name: Trivy (deps · IaC · secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  gitleaks:
    name: Gitleaks (secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fail on critical vulnerabilities
        run: npm audit --audit-level=critical
